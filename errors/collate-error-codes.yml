  meaning: Missing, expired, or invalid JWT Bearer token.
  observed: true
  observed_message: 'Not Authorized! Token not present'
- status: 403
  title: Forbidden
  meaning: Authenticated principal lacks the RBAC permission/policy for the operation.
- status: 404
  title: Not Found
  meaning: Entity (by id or fullyQualifiedName) does not exist.
  observed: true
  observed_message: 'HTTP 404 Not Found'
- status: 405
