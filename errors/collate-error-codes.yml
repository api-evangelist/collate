description: >-
  Error model for the OpenMetadata REST API. Errors are returned as a JSON
  envelope { "code": <httpStatus>, "message": <string> } (not RFC 9457
  problem+json). The status/message pairs below were observed live against the
  public API host and cross-checked with the API reference; each is a standard
  HTTP status the API returns.
format: custom
envelope:
  shape: '{ "code": <int>, "message": <string> }'
  content_type: application/json
problems:
- status: 400
  title: Bad Request
  meaning: Malformed request body or invalid query parameters / entity validation failure.
- status: 401
