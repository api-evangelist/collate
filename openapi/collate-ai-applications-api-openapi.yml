openapi: 3.2.0
info:
  title: OpenMetadata AI Applications API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: AI Applications
  description: '`AI Applications` are autonomous software entities that use LLM models to perform tasks, make decisions, and interact with data sources.'
paths:
  /v1/aiApplications/{id}/followers:
    put:
      tags:
      - AI Applications
      summary: Add a follower
      description: Add a user identified by `userId` as follower of this application
      operationId: addFollower
      parameters:
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
              format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: application for instance {id} is not found
  /v1/aiApplications:
    get:
      tags:
      - AI Applications
      summary: List AI applications
      description: Get a list of AI applications. Use `fields` parameter to get only necessary fields. Use cursor-based pagination to limit the number entries in the list using `limit` and `before` or `after` query params.
      operationId: listAIApplications
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,reviewers
      - name: limit
        in: query
        description: Limit the number applications returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of applications before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of applications after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIApplicationList'
    put:
      tags:
      - AI Applications
      summary: Create or update an AI application
      description: Create a new AI application, if it does not exist or update an existing application.
      operationId: createOrUpdateAIApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAIApplication'
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIApplication'
        '400':
          description: Bad request
    post:
      tags:
      - AI Applications
      summary: Create an AI application
      description: Create a new AI application.
      operationId: createAIApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAIApplication'
      responses:
        '200':
          description: AI Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIApplication'
        '400':
          description: Bad request
  /v1/aiApplications/name/{fqn}:
    get:
      tags:
      - AI Applications
      summary: Get an AI application by fully qualified name
      description: Get an AI application by fully qualified name.
      operationId: getAIApplicationByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of AI Application
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,reviewers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIApplication'
        '404':
          description: Application for instance {fqn} is not found
    delete:
      tags:
      - AI Applications
      summary: Delete an AI application by fully qualified name
      description: Delete an AI application by `fullyQualifiedName`.
      operationId: deleteAIApplicationByFQN
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: fqn
        in: path
        description: Name of the AI Application
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: application for instance {fqn} is not found
    patch:
      tags:
      - AI Applications
      summary: Update an AI application by name
      description: Update an existing AI application using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchAIApplication
      parameters:
      - name: fqn
        in: path
        description: Name of the AI Application
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/aiApplications/{id}:
    get:
      tags:
      - AI Applications
      summary: Get an AI application by Id
      description: Get an AI application by `Id`.
      operationId: getAIApplicationByID
      parameters:
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,reviewers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIApplication'
        '404':
          description: Application for instance {id} is not found
    delete:
      tags:
      - AI Applications
      summary: Delete an AI application by Id
      description: Delete an AI application by `Id`.
      operationId: deleteAIApplication
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: application for instance {id} is not found
    patch:
      tags:
      - AI Applications
      summary: Update an AI application
      description: Update an existing AI application using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchAIApplication_1
      parameters:
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/aiApplications/async/{id}:
    delete:
      tags:
      - AI Applications
      summary: Asynchronously delete an AI application by Id
      description: Asynchronously delete an AI application by `Id`.
      operationId: deleteAIApplicationAsync
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: AI Application for instance {id} is not found
  /v1/aiApplications/{id}/followers/{userId}:
    delete:
      tags:
      - AI Applications
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the application.
      operationId: deleteFollower
      parameters:
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/aiApplications/{id}/context:
    get:
      tags:
      - AI Applications
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/aiApplications/name/{fqn}/context:
    get:
      tags:
      - AI Applications
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/aiApplications/{id}/versions/{version}:
    get:
      tags:
      - AI Applications
      summary: Get a version of the AI application
      description: Get a version of the AI application by given `id`
      operationId: getSpecificAIApplicationVersion
      parameters:
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: AI Application version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: AIApplication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIApplication'
        '404':
          description: AI Application for instance {id} and version {version} is not found
  /v1/aiApplications/history:
    get:
      tags:
      - AI Applications
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/aiApplications/{id}/versions:
    get:
      tags:
      - AI Applications
      summary: List AI application versions
      description: Get a list of all the versions of an AI Application identified by `id`
      operationId: listAllAIApplicationVersion
      parameters:
      - name: id
        in: path
        description: Id of the AI Application
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of AI Application versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/aiApplications/restore:
    put:
      tags:
      - AI Applications
      summary: Restore a soft deleted AI application
      description: Restore a soft deleted AI Application.
      operationId: restore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: 'Successfully restored the AIApplication '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIApplication'
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    AccountabilityMeasures:
      type: object
      properties:
        hasOwner:
          type: boolean
        subjectToHumanOversight:
          type: boolean
        auditTrailEnabled:
          type: boolean
    AIApplication:
      required:
      - applicationType
      - id
      - modelConfigurations
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        description:
          type: string
        applicationType:
          type: string
          enum:
          - Chatbot
          - Agent
          - Copilot
          - Assistant
          - RAG
          - CodeGenerator
          - DataAnalyst
          - AutomationBot
          - MultiAgent
          - Custom
        developmentStage:
          type: string
          enum:
          - Proposal
          - Development
          - Testing
          - Staging
          - Production
          - Deprecated
          - Unauthorized
        modelConfigurations:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ModelConfiguration'
        primaryModel:
          $ref: '#/components/schemas/EntityReference'
        promptTemplates:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        mcpServers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataSources:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        knowledgeBases:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        upstreamApplications:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        downstreamApplications:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        framework:
          $ref: '#/components/schemas/FrameworkInfo'
        governanceMetadata:
          $ref: '#/components/schemas/GovernanceMetadata'
        biasMetrics:
          $ref: '#/components/schemas/BiasMetrics'
        performanceMetrics:
          $ref: '#/components/schemas/PerformanceMetrics'
        qualityMetrics:
          $ref: '#/components/schemas/QualityMetrics'
        safetyMetrics:
          $ref: '#/components/schemas/SafetyMetrics'
        testSuites:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        sourceCode:
          type: string
        deploymentUrl:
          type: string
        documentation:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        followers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        domain:
          $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataContract:
          $ref: '#/components/schemas/EntityReference'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        version:
          type: number
          format: double
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        href:
          type: string
          format: uri
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        deleted:
          type: boolean
        certification:
          $ref: '#/components/schemas/AssetCertification'
        extension:
          type: object
        domains:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        votes:
          $ref: '#/components/schemas/Votes'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        entityStatus:
          type: string
          enum:
          - Draft
          - In Review
          - Approved
          - Archived
          - Deprecated
          - Rejected
          - Unprocessed
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        sourceHash:
          maxLength: 32
          minLength: 1
          type: string
        usageSummary:
          $ref: '#/components/schemas/UsageDetails'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        impersonatedBy:
          type: string
        provider:
          type: string
          enum:
          - system
          - user
          - automation
        children:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        service:
          $ref: '#/components/schemas/EntityReference'
        style:
          $ref: '#/components/schemas/Style'
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    RiskAssessment:
      type: object
      properties:
        riskLevel:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Critical
        riskFactors:
          type: array
          items:
            type: string
        mitigations:
          type: array
          items:
            type: string
        assessedBy:
          type: string
        assessedAt:
          type: integer
          format: int64
    ChangeEvent:
      required:
      - entityId
      - entityType
      - eventType
      - id
      - timestamp
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - entityCreated
          - entityUpdated
          - entityFieldsChanged
          - entityNoChange
          - entitySoftDeleted
          - entityDeleted
          - entityRestored
          - threadCreated
          - threadUpdated
          - postCreated
          - postUpdated
          - taskCreated
          - taskUpdated
          - taskResolved
          - taskClosed
          - logicalTestCaseAdded
          - suggestionCreated
          - suggestionUpdated
          - suggestionAccepted
          - suggestionRejected
          - suggestionDeleted
          - userLogin
          - userLogout
          - entityLineageAdded
          - entityLineageDeleted
          - entityLineageUpdated
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        domains:
          type: array
          items:
            type: string
            format: uuid
        entityFullyQualifiedName:
          type: string
        previousVersion:
          type: number
          format: double
        currentVersion:
          type: number
          format: double
        userName:
          type: string
        impersonatedBy:
          type: string
        timestamp:
          type: integer
          format: int64
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        recursive:
          type: boolean
        entity:
          type: object
    AIEvidence:
      type: object
      properties:
        dpiaUrl:
          type: string
