openapi: 3.2.0
info:
  title: OpenMetadata RDF Reindex API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: RDF Reindex
  description: APIs related to RDF reindexing failures and status.
paths:
  /v1/rdf/reindex/failures:
    get:
      tags:
      - RDF Reindex
      summary: Get RDF reindex failures
      description: Get paginated list of failures from the last RDF reindexing run. The failure table is cleared at the start of each run, so this always reflects the most recent run. Use `offset` and `limit` for pagination.
      operationId: getRdfReindexFailures
      parameters:
      - name: offset
        in: query
        description: Offset for pagination (0 or greater)
        schema:
          minimum: 0
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: Limit the number of results returned (0 to 1000, default = 50)
        schema:
          maximum: 1000
          minimum: 0
          type: integer
          format: int64
          default: 50
      - name: entityType
        in: query
        description: Filter by canonical RDF-indexable entity type; blank means no filter
        schema:
          type: string
      responses:
        '200':
          description: List of RDF reindex failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdfReindexFailuresResponse'
        '400':
          description: offset or limit is out of range, or entityType is not an RDF-indexable OpenMetadata entity type
components:
  schemas:
    RdfReindexFailuresResponse:
      required:
      - data
      - limit
      - offset
      - total
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RdfIndexFailure'
        total:
          minimum: 0
          type: integer
          format: int32
        offset:
          minimum: 0
          type: integer
          format: int32
        limit:
          maximum: 1000
          minimum: 0
          type: integer
          format: int32
    RdfIndexFailure:
      required:
      - entityType
      - failureStage
      - id
      - jobId
      - timestamp
      type: object
      properties:
        id:
          type: string
        jobId:
          type: string
        serverId:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        entityFqn:
          type: string
        failureStage:
          type: string
        errorMessage:
          type: string
        stackTrace:
          type: string
        timestamp:
          type: integer
          format: int64
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Collate
  source: https://sandbox.open-metadata.org/swagger.json
