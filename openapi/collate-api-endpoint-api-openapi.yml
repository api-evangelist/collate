openapi: 3.2.0
info:
  title: OpenMetadata API Endpoint API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: API Endpoint
  description: A `API Endpoint` is a specific endpoint of an API that is part of an API Collection..
paths:
  /v1/apiEndpoints/{id}/followers:
    put:
      tags:
      - API Endpoint
      summary: Add a follower
      description: Add a user identified by `userId` as followed of this APiEndpoint.
      operationId: addFollower_5
      parameters:
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
              format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: APIEndpoint for instance {id} is not found
  /v1/apiEndpoints/bulk:
    put:
      tags:
      - API Endpoint
      summary: Bulk create or update API endpoints
      description: Create or update multiple API endpoints in a single operation. Returns a BulkOperationResult with success/failure details for each API endpoint.
      operationId: bulkCreateOrUpdateAPIEndpoints
      parameters:
      - name: overrideMetadata
        in: query
        description: When true, allows the bulk update to overwrite user-curated fields (description, displayName, owners, tags) that bot-driven updates normally preserve, and disables the sourceHash fast-path so unchanged entities are re-evaluated. Defaults to false.
        schema:
          type: boolean
          default: false
      - name: async
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAPIEndpoint'
      responses:
        '200':
          description: Bulk operation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '202':
          description: Bulk operation accepted for async processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: Bad request
  /v1/apiEndpoints:
    get:
      tags:
      - API Endpoint
      summary: List API Endpoints
      description: Get a list of API Endpoints, optionally filtered by `service` it belongs to. Use `fields` parameter to get only necessary fields. Use cursor-based pagination to limit the number entries in the list using `limit` and `before` or `after` query params.
      operationId: listAPIEndpoints
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,dataProducts,sourceHash
      - name: service
        in: query
        description: Filter APIEndpoints by service name
        schema:
          type: string
          example: OpenMetadata API Service
      - name: apiCollection
        in: query
        description: Filter APIEndpoints by apiCollection name
        schema:
          type: string
          example: UsersAPI
      - name: limit
        in: query
        description: Limit the number APIEndpoints returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of APIEndpoints before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of APIEndpoints after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of API Endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEndpointList'
    put:
      tags:
      - API Endpoint
      summary: Update API Endpoint
      description: Create a API Endpoint, it it does not exist or update an existing API Endpoint.
      operationId: createOrUpdateAPIEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIEndpoint'
      responses:
        '200':
          description: 'The updated api endpoint '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEndpoint'
    post:
      tags:
      - API Endpoint
      summary: Create a API Endpoint
      description: Create a API Endpoint under an existing `service`.
      operationId: createAPIEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIEndpoint'
      responses:
        '200':
          description: The API Endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEndpoint'
        '400':
          description: Bad request
  /v1/apiEndpoints/name/{fqn}:
    get:
      tags:
      - API Endpoint
      summary: Get a Endpoint by fully qualified name
      description: Get a Endpoint by fully qualified name.
      operationId: getEndpointByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the Endpoint
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,dataProducts,sourceHash
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The APIEndpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEndpoint'
        '404':
          description: Endpoint for instance {fqn} is not found
    delete:
      tags:
      - API Endpoint
      summary: Delete a APIEndpoint by fully qualified name
      description: Delete a APIEndpoint by `fullyQualifiedName`.
      operationId: deleteAPIEndpointByFQN
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: fqn
        in: path
        description: Fully qualified name of the APIEndpoint
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: APIEndpoint for instance {fqn} is not found
    patch:
      tags:
      - API Endpoint
      summary: Update a APIEndpoint using name
      description: Update an existing APIEndpoint using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchAPIEndpoint
      parameters:
      - name: fqn
        in: path
        description: Name of the APIEndpoint
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/apiEndpoints/{id}:
    get:
      tags:
      - API Endpoint
      summary: Get a APIEndpoint by id
      description: Get a APIEndpoint by `id`.
      operationId: getEndpointById
      parameters:
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,dataProducts,sourceHash
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The APIEndpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEndpoint'
        '404':
          description: APIEndpoint for instance {id} is not found
    delete:
      tags:
      - API Endpoint
      summary: Delete a APIEndpoint by id
      description: Delete a APIEndpoint by `id`.
      operationId: deleteAPIEndpoint
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: APIEndpoint for instance {id} is not found
    patch:
      tags:
      - API Endpoint
      summary: Update a APIEndpoint
      description: Update an existing APIEndpoint using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchAPIEndpoint_1
      parameters:
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/apiEndpoints/async/{id}:
    delete:
      tags:
      - API Endpoint
      summary: Asynchronously delete a APIEndpoint by id
      description: Asynchronously delete a APIEndpoint by `id`.
      operationId: deleteAPIEndpointAsync
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: APIEndpoint for instance {id} is not found
  /v1/apiEndpoints/{id}/followers/{userId}:
    delete:
      tags:
      - API Endpoint
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the APIEndpoint.
      operationId: deleteFollower_5
      parameters:
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/apiEndpoints/deleteStale:
    delete:
      tags:
      - API Endpoint
      summary: Delete stale apiendpoints within a scope
      description: Delete entities within the given scope (service, database, or databaseSchema) that the ingestion connector did not report in the current run. The connector sends the set of FQNs it saw; entities in scope not in that set are considered stale. By default the deletion is soft; pass hardDelete=true to hard-delete instead. Returns a BulkOperationResult of deleted (or, for dryRun, would-be-deleted) entities.
      operationId: bulkDeleteStaleAPIEndpoints
      requestBody:
        description: Scope to reconcile and the FQNs the connector saw this run. Carried as a request body on DELETE; a topology that strips it is rejected with 400 rather than being read as an empty seen-set.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteStaleRequest'
        required: true
      responses:
        '200':
          description: Stale deletion results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: Bad request
  /v1/apiEndpoints/{id}/context:
    get:
      tags:
      - API Endpoint
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById_9
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/apiEndpoints/name/{fqn}/context:
    get:
      tags:
      - API Endpoint
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName_9
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/apiEndpoints/{id}/versions/{version}:
    get:
      tags:
      - API Endpoint
      summary: Get a version of the APIEndpoint
      description: Get a version of the APIEndpoint by given `id`
      operationId: getSpecificEndpointVersion
      parameters:
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: APIEndpoint version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: APIEndpoint Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEndpoint'
        '404':
          description: APIEndpoint for instance {id} and version {version} is not found
  /v1/apiEndpoints/history:
    get:
      tags:
      - API Endpoint
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp_9
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/apiEndpoints/{id}/versions:
    get:
      tags:
      - API Endpoint
      summary: List API Endpoint versions
      description: Get a list of all the versions of a APIEndpoint identified by `id`
      operationId: listAllAPIEndpointVersion
      parameters:
      - name: id
        in: path
        description: Id of the APIEndpoint
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of APIEndpoint versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/apiEndpoints/restore:
    put:
      tags:
      - API Endpoint
      summary: Restore a soft deleted APIEndpoint
      description: Restore a soft deleted APIEndpoint.
      operationId: restore_5
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: 'Successfully restored the APIEndpoint. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEndpoint'
  /v1/apiEndpoints/{id}/vote:
    put:
      tags:
      - API Endpoint
      summary: Update Vote for a APIEndpoint
      description: Update vote for a APIEndpoint
      operationId: updateVoteForAPIEndpoint
      parameters:
      - name: id
        in: path
        description: Id of the Entity
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: model for instance {id} is not found
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    APIEndpointList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIEndpoint'
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    BulkDeleteStaleRequest:
      required:
      - scopeEntityType
      - scopeFqn
      - seenFqns
      type: object
      properties:
        scopeFqn:
          type: string
        scopeEntityType:
          type: string
        seenFqns:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
        hardDelete:
          type: boolean
        recursive:
          type: boolean
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    BulkOperationResult:
      type: object
      properties:
        dryRun:
          type: boolean
        status:
          type: string
          enum:
          - success
          - failure
          - aborted
          - partialSuccess
          - running
        abortReason:
          type: string
        numberOfRowsProcessed:
          minimum: 0
          type: integer
          format: int32
        numberOfRowsPassed:
          minimum: 0
          type: integer
          format: int32
        numberOfRowsFailed:
          minimum: 0
          type: integer
          format: int32
        successRequest:
          type: array
          items:
            $ref: '#/components/schemas/BulkResponse'
        failedRequest:
          type: array
          items:
            $ref: '#/components/schemas/BulkResponse'
    ChangeEvent:
      required:
      - entityId
      - entityType
      - eventType
      - id
      - timestamp
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - entityCreated
          - entityUpdated
          - entityFieldsChanged
          - entityNoChange
          - entitySoftDeleted
          - entityDeleted
          - entityRestored
          - threadCreated
          - threadUpdated
          - postCreated
          - postUpdated
          - taskCreated
          - taskUpdated
          - taskResolved
          - taskClosed
          - logicalTestCaseAdded
          - suggestionCreated
          - suggestionUpdated
          - suggestionAccepted
          - suggestionRejected
          - suggestionDeleted
          - userLogin
          - userLogout
          - entityLineageAdded
          - entityLineageDeleted
          - entityLineageUpdated
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        domains:
          type: array
          items:
            type: string
            format: uuid
        entityFullyQualifiedName:
          type: string
        previousVersion:
          type: number
          format: double
        currentVersion:
          type: number
          format: double
        userName:
          type: string
        impersonatedBy:
          type: string
        timestamp:
          type: integer
          format: int64
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        recursive:
          type: boolean
        entity:
          type: object
    APIEndpoint:
      required:
      - id
      - name
      - service
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        displayName:
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        description:
          type: string
        version:
          type: number
          format: double
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        impersonatedBy:
          type: string
        endpointURL:
          type: string
          format: uri
