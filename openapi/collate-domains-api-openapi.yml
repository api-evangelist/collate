      - name: createdBy
        in: query
        description: Filter by creator FQN
        schema:
          type: string
      - name: aboutEntity
        in: query
        description: Filter by entity FQN the task is about
        schema:
          type: string
      - name: mentionedUser
        in: query
        description: Filter by user FQN who was mentioned in task comments
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the number results
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int64
          default: 10
      - name: before
        in: query
        description: Returns list of tasks before this cursor
