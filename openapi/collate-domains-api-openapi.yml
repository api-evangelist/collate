openapi: 3.2.0
info:
  title: OpenMetadata Domains API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Domains
  description: A `Data Product` or `Data as a Product` is a logical unit that contains all components to process and store domain data for analytical or data-intensive use cases made available to data consumers.
paths:
  /v1/dataProducts/{id}/followers:
    put:
      tags:
      - Domains
      summary: Add a follower
      description: Add a user identified by `userId` as followed of this DataProduct
      operationId: addFollowerToDataProduct
      parameters:
      - name: id
        in: path
        description: Id of the DataProduct
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: DataProduct for instance {id} is not found
  /v1/dataProducts/{name}/assets/add:
    put:
      tags:
      - Domains
      summary: Bulk Add Assets
      operationId: bulkAddAssets
      parameters:
      - name: name
        in: path
        description: Name of the Data product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: model for instance {id} is not found
  /v1/dataProducts/{name}/inputPorts/add:
    put:
      tags:
      - Domains
      summary: Bulk Add Input Ports
      description: Bulk Add Input Ports to a Data Product
      operationId: bulkAddInputPorts
      parameters:
      - name: name
        in: path
        description: Name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {name} is not found
  /v1/dataProducts/name/{fqn}/inputPorts/add:
    put:
      tags:
      - Domains
      summary: Bulk Add Input Ports by Name
      description: Bulk Add Input Ports to a Data Product by fully qualified name
      operationId: bulkAddInputPortsByName
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {fqn} is not found
  /v1/dataProducts/{name}/outputPorts/add:
    put:
      tags:
      - Domains
      summary: Bulk Add Output Ports
      description: Bulk Add Output Ports to a Data Product
      operationId: bulkAddOutputPorts
      parameters:
      - name: name
        in: path
        description: Name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {name} is not found
  /v1/dataProducts/name/{fqn}/outputPorts/add:
    put:
      tags:
      - Domains
      summary: Bulk Add Output Ports by Name
      description: Bulk Add Output Ports to a Data Product by fully qualified name
      operationId: bulkAddOutputPortsByName
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {fqn} is not found
  /v1/dataProducts/{name}/assets/remove:
    put:
      tags:
      - Domains
      summary: Bulk Remove Assets
      operationId: bulkRemoveAssets
      parameters:
      - name: name
        in: path
        description: Name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: model for instance {id} is not found
  /v1/dataProducts/{name}/inputPorts/remove:
    put:
      tags:
      - Domains
      summary: Bulk Remove Input Ports
      description: Bulk Remove Input Ports from a Data Product
      operationId: bulkRemoveInputPorts
      parameters:
      - name: name
        in: path
        description: Name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {name} is not found
  /v1/dataProducts/name/{fqn}/inputPorts/remove:
    put:
      tags:
      - Domains
      summary: Bulk Remove Input Ports by Name
      description: Bulk Remove Input Ports from a Data Product by fully qualified name
      operationId: bulkRemoveInputPortsByName
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {fqn} is not found
  /v1/dataProducts/{name}/outputPorts/remove:
    put:
      tags:
      - Domains
      summary: Bulk Remove Output Ports
      description: Bulk Remove Output Ports from a Data Product
      operationId: bulkRemoveOutputPorts
      parameters:
      - name: name
        in: path
        description: Name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {name} is not found
  /v1/dataProducts/name/{fqn}/outputPorts/remove:
    put:
      tags:
      - Domains
      summary: Bulk Remove Output Ports by Name
      description: Bulk Remove Output Ports from a Data Product by fully qualified name
      operationId: bulkRemoveOutputPortsByName
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the Data Product
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssets'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: All operations failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '404':
          description: DataProduct for instance {fqn} is not found
  /v1/dataProducts:
    get:
      tags:
      - Domains
      summary: List dataProducts
      description: Get a list of DataProducts.
      operationId: listDataProducts
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: domains,owners,reviewers,experts,extension,tags,followers,votes,certification
      - name: domain
        in: query
        description: Filter data products by domain name
        schema:
          type: string
          example: marketing
      - name: limit
        in: query
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of DataProduct before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of DataProduct after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of DataProducts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProductList'
    put:
      tags:
      - Domains
      summary: Create or update a dataProduct
      description: Create a dataProduct. if it does not exist. If a dataProduct already exists, update the dataProduct.
      operationId: createOrUpdateDataProduct
      requestBody:
        description: CreateDataProduct request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataProduct'
      responses:
        '200':
          description: The dataProduct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          description: Bad request
    post:
      tags:
      - Domains
      summary: Create a dataProduct
      description: Create a new dataProduct.
      operationId: createDataProduct
      requestBody:
        description: CreateDataProduct request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataProduct'
      responses:
        '200':
          description: 'The dataProduct '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          description: Bad request
  /v1/dataProducts/odps:
    put:
      tags:
      - Domains
      summary: Create or smart-merge a data product from ODPS v4.1 JSON
      description: Create a data product if it doesn't exist, or smart-merge an ODPS v4.1 document into an existing data product. Governance-workflow-driven fields (lifecycleStage, entityStatus) are preserved from the existing product.
      operationId: createOrUpdateDataProductFromODPS
      parameters:
      - name: domain
        in: query
        description: FQN of a Domain this product belongs to
        schema:
          type: string
      - name: strategy
        in: query
        description: Merge strategy (merge|replace)
        schema:
          type: string
          default: merge
      - name: languageCode
        in: query
        description: ISO 639-1 language code to import (default 'en')
        schema:
          type: string
          default: en
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: The created or merged data product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          description: Bad request
    post:
      tags:
      - Domains
      summary: Import data product from ODPS v4.1 JSON
      description: Import a data product from Open Data Product Standard (ODPS) v4.1 JSON format. Creates a new data product.
      operationId: importDataProductFromODPS
      parameters:
      - name: domain
        in: query
        description: FQN of a Domain this product belongs to
        schema:
          type: string
      - name: languageCode
        in: query
        description: ISO 639-1 language code to import (default 'en')
        schema:
          type: string
          default: en
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: The imported data product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          description: Bad request
  /v1/dataProducts/odps/yaml:
    put:
      tags:
      - Domains
      summary: Create or smart-merge a data product from ODPS v4.1 YAML
      description: Create a data product if it doesn't exist, or smart-merge an ODPS v4.1 YAML document into an existing data product.
      operationId: createOrUpdateDataProductFromODPSYaml
      parameters:
      - name: domain
        in: query
        description: FQN of a Domain this product belongs to
        schema:
          type: string
      - name: strategy
        in: query
        description: Merge strategy (merge|replace)
        schema:
          type: string
          default: merge
      - name: languageCode
        in: query
        description: ISO 639-1 language code to import (default 'en')
        schema:
          type: string
          default: en
      requestBody:
        content:
          application/yaml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
      responses:
        '200':
          description: The created or merged data product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          description: Bad request
    post:
      tags:
      - Domains
      summary: Import data product from ODPS v4.1 YAML
      description: Import a data product from Open Data Product Standard (ODPS) v4.1 YAML format. Creates a new data product.
      operationId: importDataProductFromODPSYaml
      parameters:
      - name: domain
        in: query
        description: FQN of a Domain this product belongs to
        schema:
          type: string
      - name: languageCode
        in: query
        description: ISO 639-1 language code to import (default 'en')
        schema:
          type: string
          default: en
      requestBody:
        content:
          application/yaml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
      responses:
        '200':
          description: The imported data product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          description: Bad request
  /v1/dataProducts/name/{name}:
    get:
      tags:
      - Domains
      summary: Get a dataProduct by name
      description: Get a dataProduct by `name`.
      operationId: getDataProductByFQN
      parameters:
      - name: name
        in: path
        description: Name of the dataProduct
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: domains,owners,reviewers,experts,extension,tags,followers,votes,certification
      responses:
        '200':
          description: dataProduct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '404':
          description: DataProduct for instance {name} is not found
    delete:
      tags:
      - Domains
      summary: Delete a dataProduct by name
      description: Delete a dataProduct by `name`.
      operationId: deleteDataProductByFQN
      parameters:
      - name: name
        in: path
        description: Name of the dataProduct
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: DataProduct for instance {name} is not found
  /v1/dataProducts/{id}:
    get:
      tags:
      - Domains
      summary: Get a dataProduct by Id
      description: Get a dataProduct by `Id`.
      operationId: getDataProductByID
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: domains,owners,reviewers,experts,extension,tags,followers,votes,certification
      - name: id
        in: path
        description: Id of the dataProduct
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The dataProduct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '404':
          description: DataProduct for instance {id} is not found
    delete:
      tags:
      - Domains
      summary: Delete a dataProduct by Id
      description: Delete a dataProduct by `Id`.
      operationId: deleteDataProduct
      parameters:
      - name: id
        in: path
        description: Id of the dataProduct
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: DataProduct for instance {id} is not found
    patch:
      tags:
      - Domains
      summary: Update a dataProduct
      description: Update an existing dataProduct using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchDataProduct_1
      parameters:
      - name: id
        in: path
        description: Id of the dataProduct
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/dataProducts/async/{id}:
    delete:
      tags:
      - Domains
      summary: Asynchronously delete a dataProduct by Id
      description: Asynchronously delete a dataProduct by `Id`.
      operationId: deleteDataProductAsync
      parameters:
      - name: id
        in: path
        description: Id of the dataProduct
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: DataProduct for instance {id} is not found
  /v1/dataProducts/{id}/followers/{userId}:
    delete:
      tags:
      - Domains
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the dataProduct.
      operationId: deleteFollowerFromDataProduct
      parameters:
      - name: id
        in: path
        description: Id of the Entity
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/dataProducts/{id}/odps:
    get:
      tags:
      - Domains
      summary: Export data product to ODPS v4.1 format
      description: Export a data product to Open Data Product Standard (ODPS) v4.1 JSON format.
      operationId: exportDataProductToODPS
      parameters:
      - name: id
        in: path
        description: Id of the data product
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ODPS data product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODPSDataProduct'
        '404':
          description: Data product not found
  /v1/dataProducts/name/{fqn}/odps:
    get:
      tags:
      - Domains
      summary: Export data product to ODPS v4.1 format by FQN
      description: Export a data product to Open Data Product Standard (ODPS) v4.1 JSON format by fully qualified name.
      operationId: exportDataProductToODPSByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the data product
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ODPS data product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODPSDataProduct'
        '404':
          description: Data product not found
  /v1/dataProducts/{id}/odps/yaml:
    get:
      tags:
      - Domains
      summary: Export data product to ODPS v4.1 YAML format
      description: Export a data product to Open Data Product Standard (ODPS) v4.1 YAML format.
      operationId: exportDataProductToODPSYaml
      parameters:
      - name: id
        in: path
        description: Id of the data product
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ODPS data product in YAML format
          content:
            application/yaml: {}
        '404':
          description: Data product not found
  /v1/dataProducts/name/{fqn}/odps/yaml:
    get:
      tags:
      - Domains
      summary: Export data product to ODPS v4.1 YAML format by FQN
      description: Export a data product to Open Data Product Standard (ODPS) v4.1 YAML format by fully qualified name.
      operationId: exportDataProductToODPSYamlByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the data product
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ODPS data product in YAML format
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: Data product not found
  /v1/dataProducts/{id}/context:
    get:
      tags:
      - Domains
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById_23
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/dataProducts/name/{fqn}/context:
    get:
      tags:
      - Domains
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName_23
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/dataProducts/assets/counts:
    get:
      tags:
      - Domains
      summary: Get all data products with their asset counts
      description: Get a map of data product fully qualified names to their asset counts using search aggregation.
      operationId: getAllDataProductsWithAssetsCount
      responses:
        '200':
          description: Map of data product FQN to asset count
