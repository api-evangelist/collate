openapi: 3.2.0
info:
  title: OpenMetadata Context Center Drive Folders API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Context Center Drive Folders
  description: APIs for managing folders in the Context Center Drive.
paths:
  /v1/contextCenter/drive/folders:
    get:
      tags:
      - Context Center Drive Folders
      summary: List folders
      operationId: listDriveFolders
      parameters:
      - name: fields
        in: query
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the number of folders returned. (0 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        schema:
          type: string
      - name: after
        in: query
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderList'
    put:
      tags:
      - Context Center Drive Folders
      summary: Create or update a folder
      operationId: createOrUpdateDriveFolder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolder'
      responses:
        default:
          description: default response
          content:
            application/json: {}
    post:
      tags:
      - Context Center Drive Folders
      summary: Create a folder
      operationId: createDriveFolder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolder'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/contextCenter/drive/folders/{id}:
    get:
      tags:
      - Context Center Drive Folders
      summary: Get a folder by ID
      operationId: getDriveFolder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
    delete:
      tags:
      - Context Center Drive Folders
      summary: Delete a folder
      description: Delete a folder and all contained folders and files.
      operationId: deleteDriveFolder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: hardDelete
        in: query
        description: Permanently delete the folder asynchronously.
        schema:
          type: boolean
          default: false
      responses:
        default:
          description: default response
          content:
            application/json: {}
    patch:
      tags:
      - Context Center Drive Folders
      summary: Update a folder via JSON Patch
      operationId: patchDriveFolder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/contextCenter/drive/folders/{id}/context:
    get:
      tags:
      - Context Center Drive Folders
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById_29
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/contextCenter/drive/folders/name/{fqn}/context:
    get:
      tags:
      - Context Center Drive Folders
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName_29
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/contextCenter/drive/folders/name/{fqn}:
    get:
      tags:
      - Context Center Drive Folders
      summary: Get a folder by FQN
      operationId: getDriveFolderByFqn
      parameters:
      - name: fqn
        in: path
        required: true
        schema:
          type: string
      - name: fields
        in: query
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
  /v1/contextCenter/drive/folders/{id}/contents:
    get:
      tags:
      - Context Center Drive Folders
      summary: Get the direct contents of a folder
      operationId: getDriveFolderContents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderContents'
  /v1/contextCenter/drive/folders/history:
    get:
      tags:
      - Context Center Drive Folders
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp_29
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/contextCenter/drive/folders/restore:
    put:
      tags:
      - Context Center Drive Folders
      summary: Restore a soft deleted drive folder
      description: Restore a folder from the trash.
      operationId: restoreDriveFolder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        default:
          description: default response
          content:
            application/json: {}
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    ContextFile:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        description:
          type: string
        fileType:
          type: string
          enum:
          - PDF
          - Spreadsheet
          - Presentation
          - Image
          - Document
          - CSV
          - Text
          - Archive
          - Other
        fileSize:
          minimum: 0
          type: integer
          format: int32
        contentType:
          type: string
        fileExtension:
          type: string
        assetId:
          type: string
        headContentId:
          type: string
        processingStatus:
          type: string
          enum:
          - Uploaded
          - Analyzing
          - ExtractingContext
          - Processed
          - Failed
          - Unsupported
        processingError:
          type: string
        extractionStats:
          $ref: '#/components/schemas/ExtractionStats'
        extractedText:
          type: string
        pageCount:
          type: integer
          format: int32
        memoryCount:
          type: integer
          format: int32
        sourceType:
          type: string
          enum:
          - Upload
          - DriveSync
          - Confluence
          - Notion
        sourceId:
          type: string
        sourceUrl:
          type: string
          format: uri
        folder:
          $ref: '#/components/schemas/EntityReference'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        version:
          type: number
          format: double
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        href:
          type: string
          format: uri
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        deleted:
          type: boolean
        domains:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        followers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        votes:
          $ref: '#/components/schemas/Votes'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataContract:
          $ref: '#/components/schemas/EntityReference'
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        usageSummary:
          $ref: '#/components/schemas/UsageDetails'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        entityStatus:
          type: string
          enum:
          - Draft
          - In Review
          - Approved
          - Archived
          - Deprecated
          - Rejected
          - Unprocessed
        certification:
          $ref: '#/components/schemas/AssetCertification'
        sourceHash:
          type: string
        impersonatedBy:
          type: string
        provider:
          type: string
          enum:
          - system
          - user
          - automation
        extension:
          type: object
        children:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        service:
          $ref: '#/components/schemas/EntityReference'
        style:
          $ref: '#/components/schemas/Style'
    ChangeSummaryMap:
      type: object
    LifeCycle:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/AccessDetails'
        updated:
          $ref: '#/components/schemas/AccessDetails'
        accessed:
          $ref: '#/components/schemas/AccessDetails'
    JsonPatch:
      type: object
    ChangeDescription:
      type: object
      properties:
        fieldsAdded:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsUpdated:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsDeleted:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        previousVersion:
          type: number
          format: double
        changeSummary:
          $ref: '#/components/schemas/ChangeSummaryMap'
    ResultList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    Folder:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        description:
          type: string
        icon:
          type: string
        color:
          type: string
        parent:
          $ref: '#/components/schemas/EntityReference'
        children:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        childrenCount:
          type: integer
          format: int32
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        version:
          type: number
          format: double
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        href:
          type: string
          format: uri
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        deleted:
          type: boolean
        domains:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        followers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataContract:
          $ref: '#/components/schemas/EntityReference'
        votes:
          $ref: '#/components/schemas/Votes'
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        usageSummary:
          $ref: '#/components/schemas/UsageDetails'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        entityStatus:
          type: string
          enum:
          - Draft
          - In Review
          - Approved
          - Archived
          - Deprecated
          - Rejected
          - Unprocessed
        certification:
          $ref: '#/components/schemas/AssetCertification'
        sourceHash:
          type: string
        impersonatedBy:
          type: string
        provider:
          type: string
          enum:
          - system
          - user
          - automation
        extension:
          type: object
        service:
          $ref: '#/components/schemas/EntityReference'
        style:
          $ref: '#/components/schemas/Style'
    UsageStats:
      required:
      - count
      type: object
      properties:
        count:
          minimum: 0
          type: integer
          format: int32
        percentileRank:
          type: number
          format: double
    FieldChange:
      type: object
      properties:
        name:
          type: string
        oldValue:
          type: object
        newValue:
          type: object
    FolderContents:
      type: object
      properties:
        folder:
          $ref: '#/components/schemas/Folder'
        folders:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ContextFile'
        childrenFolderCount:
          type: integer
          format: int32
        childrenFileCount:
          type: integer
          format: int32
        itemCount:
          type: integer
          format: int32
    UsageDetails:
      required:
      - dailyStats
      - date
      type: object
      properties:
        dailyStats:
          $ref: '#/components/schemas/UsageStats'
        weeklyStats:
          $ref: '#/components/schemas/UsageStats'
        monthlyStats:
          $ref: '#/components/schemas/UsageStats'
        date:
          type: string
    ExtractionStats:
      type: object
      properties:
        chunksTotal:
          type: integer
          format: int32
        chunksProcessed:
          type: integer
          format: int32
        pillsCreated:
          type: integer
          format: int32
        lastExtractedAt:
          type: integer
          format: int64
        sourceHash:
          type: string
    PatternMatch:
      required:
      - name
      - score
      type: object
      properties:
        name:
          type: string
        regex:
          type: string
        score:
          type: number
          format: double
    Style:
      type: object
      properties:
        color:
          type: string
        iconURL:
          type: string
        coverImage:
          $ref: '#/components/schemas/CoverImage'
    Votes:
      type: object
      properties:
        upVotes:
          type: integer
          format: int32
        downVotes:
          type: integer
          format: int32
        upVoters:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        downVoters:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
    AssetCertification:
      required:
      - appliedDate
      - expiryDate
      - tagLabel
      type: object
      properties:
        tagLabel:
          $ref: '#/components/schemas/TagLabel'
        appliedDate:
          type: integer
          format: int64
        expiryDate:
          type: integer
          format: int64
    CreateFolder:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        displayName:
          type: string
        description:
          type: string
        icon:
          type: string
        color:
          type: string
        parent:
          maxLength: 3072
          minLength: 1
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        domains:
          type: array
          items:
            type: string
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            type: string
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        extension:
          type: object
    FolderList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    TagLabelMetadata:
      type: object
      properties:
        recognizer:
          $ref: '#/components/schemas/TagLabelRecognizerMetadata'
        expiryDate:
          type: integer
          format: int64
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Collate
  source: https://sandbox.open-metadata.org/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
