openapi: 3.2.0
info:
  title: OpenMetadata Directories API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Directories
  description: A `Directory` is a folder or organizational unit in a Drive Service that can contain files, spreadsheets, and other directories.
paths:
  /v1/drives/directories/{id}/followers:
    put:
      tags:
      - Directories
      summary: Add a follower
      description: Add a user identified by `userId` as follower of this directory
      operationId: addFollowerToDirectory
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
              format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: Directory for instance {id} is not found
  /v1/drives/directories/bulk:
    put:
      tags:
      - Directories
      summary: Bulk create or update directories
      description: Create or update multiple directories in a single operation.
      operationId: bulkCreateOrUpdateDirectorys
      parameters:
      - name: overrideMetadata
        in: query
        description: When true, allows the bulk update to overwrite user-curated fields (description, displayName, owners, tags) that bot-driven updates normally preserve, and disables the sourceHash fast-path so unchanged entities are re-evaluated. Defaults to false.
        schema:
          type: boolean
          default: false
      - name: async
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateDirectory'
      responses:
        '200':
          description: Bulk operation results
        '202':
          description: Bulk operation accepted for async processing
        '400':
          description: Bad request
  /v1/drives/directories:
    get:
      tags:
      - Directories
      summary: List directories
      description: Get a list of directories, optionally filtered by `service` it belongs to. Use `fields` parameter to get only necessary fields. Use cursor-based pagination to limit the number entries in the list using `limit` and `before` or `after` query params.
      operationId: listDirectories
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,children,parent,usageSummary,tags,extension,domains,sourceHash,lifeCycle,votes,followers,numberOfFiles,numberOfSubDirectories,totalSize,directoryType
      - name: service
        in: query
        description: Filter directories by service name
        schema:
          type: string
          example: googleDrive
      - name: parent
        in: query
        description: Filter directories by parent directory fully qualified name
        schema:
          type: string
      - name: root
        in: query
        description: Include only root directories (directories without parent)
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        description: Limit the number directories returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of directories before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of directories after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of directories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryList'
    put:
      tags:
      - Directories
      summary: Create or update a directory
      description: Create a new directory, if it does not exist or update an existing directory.
      operationId: createOrUpdateDirectory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectory'
      responses:
        '200':
          description: The directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '400':
          description: Bad request
    post:
      tags:
      - Directories
      summary: Create a directory
      description: Create a new directory under an existing `service` or `parent` directory.
      operationId: createDirectory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectory'
      responses:
        '200':
          description: The directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '400':
          description: Bad request
  /v1/drives/directories/name/{fqn}:
    get:
      tags:
      - Directories
      summary: Get a directory by fully qualified name
      description: Get a directory by fully qualified name.
      operationId: getDirectoryByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the directory
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,children,parent,usageSummary,tags,extension,domains,sourceHash,lifeCycle,votes,followers,numberOfFiles,numberOfSubDirectories,totalSize,directoryType
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '404':
          description: Directory for instance {fqn} is not found
    delete:
      tags:
      - Directories
      summary: Delete a directory by fully qualified name
      description: Delete a directory by `fullyQualifiedName`.
      operationId: deleteDirectoryByFQN
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: fqn
        in: path
        description: Fully qualified name of the directory
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: Directory for instance {fqn} is not found
    patch:
      tags:
      - Directories
      summary: Update a directory by name
      description: Update an existing directory using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchDirectory
      parameters:
      - name: fqn
        in: path
        description: Name of the directory
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/drives/directories/{id}:
    get:
      tags:
      - Directories
      summary: Get a directory by Id
      description: Get a directory by `Id`.
      operationId: getDirectoryByID
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,children,parent,usageSummary,tags,extension,domains,sourceHash,lifeCycle,votes,followers,numberOfFiles,numberOfSubDirectories,totalSize,directoryType
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '404':
          description: Directory for instance {id} is not found
    delete:
      tags:
      - Directories
      summary: Delete a directory by Id
      description: Delete a directory by `Id`.
      operationId: deleteDirectory
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Directory for instance {id} is not found
    patch:
      tags:
      - Directories
      summary: Update a directory
      description: Update an existing directory using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchDirectory_1
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/drives/directories/async/{id}:
    delete:
      tags:
      - Directories
      summary: Asynchronously delete a directory by Id
      description: Asynchronously delete a directory by `Id`.
      operationId: deleteDirectoryAsync
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete related entities. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Directory for instance {id} is not found
  /v1/drives/directories/{id}/followers/{userId}:
    delete:
      tags:
      - Directories
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the directory.
      operationId: removeFollowerFromDirectory
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/drives/directories/deleteStale:
    delete:
      tags:
      - Directories
      summary: Delete stale directories within a scope
      description: Delete entities within the given scope that the ingestion connector did not report in the current run. The connector sends the set of FQNs it saw; entities in scope not in that set are considered stale. By default the deletion is soft; pass hardDelete=true to hard-delete instead. Returns a BulkOperationResult of deleted (or, for dryRun, would-be-deleted) entities.
      operationId: bulkDeleteStaleDirectories
      requestBody:
        description: Scope to reconcile and the FQNs the connector saw this run. Carried as a request body on DELETE; a topology that strips it is rejected with 400 rather than being read as an empty seen-set.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteStaleRequest'
        required: true
      responses:
        '200':
          description: Stale deletion results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: Bad request
  /v1/drives/directories/export:
    get:
      tags:
      - Directories
      summary: Export directories to CSV
      description: Export directories to CSV file.
      operationId: exportDirectories
      parameters:
      - name: name
        in: query
        description: Directory filter pattern
        schema:
          type: string
      responses:
        '200':
          description: CSV file with directories
          content:
            application/json: {}
  /v1/drives/directories/{id}/context:
    get:
      tags:
      - Directories
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById_30
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/drives/directories/name/{fqn}/context:
    get:
      tags:
      - Directories
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName_30
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/drives/directories/{id}/versions/{version}:
    get:
      tags:
      - Directories
      summary: Get a specific version of the directory
      description: Get a specific version of the directory identified by `Id`
      operationId: getSpecificDirectoryVersion
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: Directory version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: Directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '404':
          description: Directory for instance {id} and version {version} is not found
  /v1/drives/directories/import:
    post:
      tags:
      - Directories
      summary: Import directory from CSV
      description: Import a CSV file generated by the export service endpoint.
      operationId: importDirectory
      parameters:
      - name: dryRun
        in: query
        description: Dry run when true is passed for testing the CSV
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: CSV import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportResult'
  /v1/drives/directories/history:
    get:
      tags:
      - Directories
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp_30
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/drives/directories/{id}/versions:
    get:
      tags:
      - Directories
      summary: List directory versions
      description: Get a list of all the versions of a directory identified by `Id`
      operationId: listAllDirectoryVersion
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of directory versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/drives/directories/restore:
    put:
      tags:
      - Directories
      summary: Restore a soft deleted directory by id
      description: Restore a soft deleted directory by id.
      operationId: restoreDirectoryById
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: Successfully restored the directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
  /v1/drives/directories/{id}/restore:
    put:
      tags:
      - Directories
      summary: Restore a soft deleted directory
      description: Restore a soft deleted directory.
      operationId: restoreDirectory
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'Successfully restored the directory '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
  /v1/drives/directories/{id}/vote:
    put:
      tags:
      - Directories
      summary: Update Vote for a directory
      description: Update vote for a directory
      operationId: updateVoteForDirectory
      parameters:
      - name: id
        in: path
        description: Id of the directory
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: Directory for instance {id} is not found
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    DirectoryList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Directory'
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    BulkDeleteStaleRequest:
      required:
      - scopeEntityType
      - scopeFqn
      - seenFqns
      type: object
      properties:
        scopeFqn:
          type: string
        scopeEntityType:
          type: string
        seenFqns:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
        hardDelete:
          type: boolean
        recursive:
          type: boolean
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    BulkOperationResult:
      type: object
      properties:
        dryRun:
          type: boolean
        status:
          type: string
          enum:
          - success
          - failure
          - aborted
          - partialSuccess
          - running
        abortReason:
          type: string
        numberOfRowsProcessed:
          minimum: 0
          type: integer
          format: int32
        numberOfRowsPassed:
          minimum: 0
          type: integer
          format: int32
        numberOfRowsFailed:
          minimum: 0
          type: integer
          format: int32
        successRequest:
          type: array
          items:
            $ref: '#/components/schemas/BulkResponse'
        failedRequest:
          type: array
          items:
            $ref: '#/components/schemas/BulkResponse'
    Directory:
      required:
      - id
      - name
      - service
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
