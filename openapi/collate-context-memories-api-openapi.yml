        displayName:
          type: string
        description:
          type: string
        title:
          type: string
        summary:
          type: string
        question:
          type: string
        answer:
          type: string
        memoryType:
          type: string
          enum:
          - Preference
          - UseCase
          - Note
          - Runbook
          - Faq
        memoryScope:
          type: string
          enum:
          - UserGlobal
          - EntityScoped
        status:
          type: string
          enum:
          - Draft
          - Active
          - Archived
        shareConfig:
          $ref: '#/components/schemas/MemoryShareConfig'
        primaryEntity:
          $ref: '#/components/schemas/EntityReference'
        relatedEntities:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        sourceType:
          type: string
          enum:
          - Manual
          - ChatPromotion
          - RememberRequest
          - FileExtraction
          - PageExtraction
        sourceConversation:
          type: string
          format: uuid
        sourceHumanMessage:
          type: string
          format: uuid
        sourceAssistantMessage:
          type: string
          format: uuid
        sourceFile:
          $ref: '#/components/schemas/EntityReference'
        sourceEntity:
          $ref: '#/components/schemas/EntityReference'
        rootMemory:
          $ref: '#/components/schemas/EntityReference'
        parentMemory:
          $ref: '#/components/schemas/EntityReference'
        machineRepresentation:
          $ref: '#/components/schemas/ContextMemoryRepresentation'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        domains:
          type: array
          items:
            type: string
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            type: string
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
