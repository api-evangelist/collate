openapi: 3.2.0
info:
  title: OpenMetadata Metadata Services API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Metadata Services
  description: APIs related to creating and managing other Metadata Services that OpenMetadata integrates with such as `Apache Atlas`, `Amundsen`, etc.
paths:
  /v1/services/metadataServices/{id}/followers:
    put:
      tags:
      - Metadata Services
      summary: Add a follower
      description: Add a user identified by `userId` as followed of this Metadata service
      operationId: addFollowerToMetadataService
      parameters:
      - name: id
        in: path
        description: Id of the Metadata Service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: Metadata Service for instance {id} is not found
  /v1/services/metadataServices/{id}/testConnectionResult:
    put:
      tags:
      - Metadata Services
      summary: Add test connection result
      description: Add test connection result to the service.
      operationId: addTestConnectionResult_7
      parameters:
      - name: id
        in: path
        description: Id of the service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionResult'
      responses:
        '200':
          description: Successfully updated the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataService'
  /v1/services/metadataServices:
    get:
      tags:
      - Metadata Services
      summary: List metadata services
      description: Get a list of metadata services.
      operationId: listMetadataServices
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: pipelines,owners,tags,followers
      - name: limit
        in: query
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of metadata services before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of metadata services after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of Metadata Service instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataServiceList'
    put:
      tags:
      - Metadata Services
      summary: Update metadata service
      description: Update an existing or create a new Metadata Service.
      operationId: createOrUpdateMetadataService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetadataService'
      responses:
        '200':
          description: Metadata Service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataService'
        '400':
          description: Bad request
    post:
      tags:
      - Metadata Services
      summary: Create metadata service
      description: Create a new Metadata Service.
      operationId: createMetadataService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetadataService'
      responses:
        '200':
          description: Metadata Service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataService'
        '400':
          description: Bad request
  /v1/services/metadataServices/name/{name}:
    get:
      tags:
      - Metadata Services
      summary: Get a metadata service by name
      description: Get a Metadata Service by the service `name`.
      operationId: getMetadataServiceByFQN
      parameters:
      - name: name
        in: path
        description: Name of the metadata service
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: pipelines,owners,tags,followers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: Metadata Service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataService'
        '404':
          description: Metadata Service for instance {name} is not found
    delete:
      tags:
      - Metadata Services
      summary: Delete a metadata service by name
      description: Delete a metadata services by `name`. If some service belong the service, it can't be deleted.
      operationId: deleteMetadataServiceByName
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: name
        in: path
        description: Name of the metadata service
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: MetadataService service for instance {name} is not found
  /v1/services/metadataServices/{id}:
    get:
      tags:
      - Metadata Services
      summary: Get a metadata service by Id
      description: Get a Metadata Service by `Id`.
      operationId: getMetadataServiceByID
      parameters:
      - name: id
        in: path
        description: Id of the metadata service
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: pipelines,owners,tags,followers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: Metadata Service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataService'
        '404':
          description: Metadata Service for instance {id} is not found
    delete:
      tags:
      - Metadata Services
      summary: Delete a metadata service by Id
      description: Delete a metadata services. If some service belong the service, it can't be deleted.
      operationId: deleteMetadataService
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the metadata service
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: MetadataService service for instance {id} is not found
    patch:
      tags:
      - Metadata Services
      summary: Update a metadata service
      description: Update an existing Metadata service using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchMetadataService_1
      parameters:
      - name: id
        in: path
        description: Id of the metadata service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/services/metadataServices/async/{id}:
    delete:
      tags:
      - Metadata Services
      summary: Asynchronously delete a metadata service by Id
      description: Asynchronously delete a metadata services. If some service belong the service, it can't be deleted.
      operationId: deleteMetadataServiceAsync
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the metadata service
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: MetadataService service for instance {id} is not found
  /v1/services/metadataServices/{id}/followers/{userId}:
    delete:
      tags:
      - Metadata Services
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the entity.
      operationId: deleteFollower_23
      parameters:
      - name: id
        in: path
        description: Id of the Entity
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/services/metadataServices/{id}/context:
    get:
      tags:
      - Metadata Services
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById_59
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/services/metadataServices/name/{fqn}/context:
    get:
      tags:
      - Metadata Services
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName_59
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/services/metadataServices/{id}/versions/{version}:
    get:
      tags:
      - Metadata Services
      summary: Get a version of the metadata service
      description: Get a version of the Metadata Service by given `Id`
      operationId: getSpecificMetadataServiceVersion
      parameters:
      - name: id
        in: path
        description: Id of the metadata service
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: Metadata Service version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: Metadata Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataService'
        '404':
          description: Metadata Service for instance {id} and version {version} is not found
  /v1/services/metadataServices/history:
    get:
      tags:
      - Metadata Services
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp_58
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/services/metadataServices/{id}/versions:
    get:
      tags:
      - Metadata Services
      summary: List metadata service versions
      description: Get a list of all the versions of a Metadata Service identified by `Id`
      operationId: listAllMetadataServiceVersion
      parameters:
      - name: id
        in: path
        description: Id of the metadata service
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of Metadata Service versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/services/metadataServices/name/{fqn}:
    patch:
      tags:
      - Metadata Services
      summary: Update a metadata service using name
      description: Update an existing Metadata service using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchMetadataService
      parameters:
      - name: fqn
        in: path
        description: Name of the metadata service
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/services/metadataServices/restore:
    put:
      tags:
      - Metadata Services
      summary: Restore a soft deleted metadata service
      description: Restore a soft deleted metadata service.
      operationId: restore_39
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: 'Successfully restored the MetadataService '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataService'
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    MetadataConnection:
      type: object
      properties:
        config:
          type: object
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    MetadataService:
      required:
      - id
      - name
      - serviceType
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        serviceType:
          type: string
          enum:
          - Amundsen
          - MetadataES
          - OpenMetadata
          - Atlas
          - Alation
          - AlationSink
          - Collibra
        description:
          type: string
        connection:
          $ref: '#/components/schemas/MetadataConnection'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        version:
          type: number
          format: double
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        impersonatedBy:
          type: string
        testConnectionResult:
          $ref: '#/components/schemas/TestConnectionResult'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        href:
          type: string
          format: uri
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        deleted:
          type: boolean
        entityStatus:
          type: string
          enum:
          - Draft
          - In Review
          - Approved
          - Archived
          - Deprecated
          - Rejected
          - Unprocessed
        provider:
          type: string
          enum:
          - system
          - user
          - automation
        followers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        ingestionRunner:
          $ref: '#/components/schemas/EntityReference'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataContract:
          $ref: '#/components/schemas/EntityReference'
        votes:
          $ref: '#/components/schemas/Votes'
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        usageSummary:
          $ref: '#/components/schemas/UsageDetails'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        certification:
          $ref: '#/components/schemas/AssetCertification'
        sourceHash:
          type: string
        extension:
          type: object
        children:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        service:
          $ref: '#/components/schemas/EntityReference'
        style:
          $ref: '#/components/schemas/Style'
    ChangeEvent:
      required:
      - entityId
      - entityType
      - eventType
      - id
      - timestamp
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - entityCreated
          - entityUpdated
          - entityFieldsChanged
          - entityNoChange
          - entitySoftDeleted
          - entityDeleted
          - entityRestored
          - threadCreated
          - threadUpdated
          - postCreated
          - postUpdated
          - taskCreated
          - taskUpdated
          - taskResolved
          - taskClosed
          - logicalTestCaseAdded
          - suggestionCreated
          - suggestionUpdated
          - suggestionAccepted
          - suggestionRejected
          - suggestionDeleted
          - userLogin
          - userLogout
          - entityLineageAdded
          - entityLineageDeleted
          - entityLineageUpdated
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        domains:
          type: array
          items:
            type: string
            format: uuid
        entityFullyQualifiedName:
          type: string
        previousVersion:
          type: number
          format: double
        currentVersion:
          type: number
          format: double
        userName:
          type: string
        impersonatedBy:
          type: string
        timestamp:
          type: integer
          format: int64
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        recursive:
          type: boolean
        entity:
          type: object
    ChangeSummaryMap:
      type: object
    LifeCycle:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/AccessDetails'
        updated:
          $ref: '#/components/schemas/AccessDetails'
        accessed:
          $ref: '#/components/schemas/AccessDetails'
    JsonPatch:
      type: object
    ChangeDescription:
      type: object
      properties:
        fieldsAdded:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsUpdated:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsDeleted:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        previousVersion:
          type: number
          format: double
        changeSummary:
          $ref: '#/components/schemas/ChangeSummaryMap'
    ResultList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    MetadataServiceList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MetadataService'
