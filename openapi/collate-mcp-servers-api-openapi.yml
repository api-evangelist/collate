openapi: 3.2.0
info:
  title: OpenMetadata MCP Servers API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: MCP Servers
  description: '`MCP Servers` are Model Context Protocol servers that expose tools, resources, and prompts for AI applications. They enable AI governance including risk assessment, compliance tracking, and shadow AI detection.'
paths:
  /v1/mcpServers/{id}/followers:
    put:
      tags:
      - MCP Servers
      summary: Add a follower
      description: Add a user identified by `userId` as follower of this MCP server
      operationId: addFollower_3
      parameters:
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
              format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: MCP Server for instance {id} is not found
  /v1/mcpServers:
    get:
      tags:
      - MCP Servers
      summary: List MCP servers
      description: Get a list of MCP servers. Use `fields` parameter to get only necessary fields. Use cursor-based pagination to limit the number of entries in the list using `limit` and `before` or `after` query params.
      operationId: listMcpServers
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,reviewers,tools,resources,prompts,service
      - name: limit
        in: query
        description: Limit the number of servers returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of servers before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of servers after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of MCP servers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerList'
    put:
      tags:
      - MCP Servers
      summary: Create or update an MCP server
      description: Create a new MCP server, if it does not exist or update an existing server.
      operationId: createOrUpdateMcpServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpServer'
      responses:
        '200':
          description: The MCP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServer'
        '400':
          description: Bad request
    post:
      tags:
      - MCP Servers
      summary: Create an MCP server
      description: Create a new MCP server.
      operationId: createMcpServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpServer'
      responses:
        '200':
          description: MCP Server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServer'
        '400':
          description: Bad request
  /v1/mcpServers/name/{fqn}:
    get:
      tags:
      - MCP Servers
      summary: Get an MCP server by fully qualified name
      description: Get an MCP server by fully qualified name.
      operationId: getMcpServerByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of MCP Server
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,reviewers,tools,resources,prompts,service
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The MCP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServer'
        '404':
          description: MCP Server for instance {fqn} is not found
    delete:
      tags:
      - MCP Servers
      summary: Delete an MCP server by fully qualified name
      description: Delete an MCP server by `fullyQualifiedName`.
      operationId: deleteMcpServerByFQN
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: fqn
        in: path
        description: Name of the MCP Server
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: MCP Server for instance {fqn} is not found
    patch:
      tags:
      - MCP Servers
      summary: Update an MCP server by name
      description: Update an existing MCP server using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchMcpServerByName
      parameters:
      - name: fqn
        in: path
        description: Name of the MCP Server
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/mcpServers/{id}:
    get:
      tags:
      - MCP Servers
      summary: Get an MCP server by Id
      description: Get an MCP server by `Id`.
      operationId: getMcpServerByID
      parameters:
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,followers,tags,extension,domains,reviewers,tools,resources,prompts,service
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The MCP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServer'
        '404':
          description: MCP Server for instance {id} is not found
    delete:
      tags:
      - MCP Servers
      summary: Delete an MCP server by Id
      description: Delete an MCP server by `Id`.
      operationId: deleteMcpServer
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: MCP Server for instance {id} is not found
    patch:
      tags:
      - MCP Servers
      summary: Update an MCP server
      description: Update an existing MCP server using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchMcpServer
      parameters:
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/mcpServers/async/{id}:
    delete:
      tags:
      - MCP Servers
      summary: Asynchronously delete an MCP server by Id
      description: Asynchronously delete an MCP server by `Id`.
      operationId: deleteMcpServerAsync
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: MCP Server for instance {id} is not found
  /v1/mcpServers/{id}/followers/{userId}:
    delete:
      tags:
      - MCP Servers
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the MCP server.
      operationId: deleteFollower_3
      parameters:
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/mcpServers/{id}/context:
    get:
      tags:
      - MCP Servers
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById_6
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/mcpServers/name/{fqn}/context:
    get:
      tags:
      - MCP Servers
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName_6
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/mcpServers/{id}/versions/{version}:
    get:
      tags:
      - MCP Servers
      summary: Get a version of the MCP server
      description: Get a version of the MCP server by given `id`
      operationId: getSpecificMcpServerVersion
      parameters:
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: MCP Server version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: McpServer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServer'
        '404':
          description: MCP Server for instance {id} and version {version} is not found
  /v1/mcpServers/history:
    get:
      tags:
      - MCP Servers
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp_6
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/mcpServers/{id}/versions:
    get:
      tags:
      - MCP Servers
      summary: List MCP server versions
      description: Get a list of all the versions of an MCP Server identified by `id`
      operationId: listAllMcpServerVersions
      parameters:
      - name: id
        in: path
        description: Id of the MCP Server
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of MCP Server versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/mcpServers/restore:
    put:
      tags:
      - MCP Servers
      summary: Restore a soft deleted MCP server
      description: Restore a soft deleted MCP server.
      operationId: restoreMcpServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: Successfully restored the MCP Server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServer'
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    McpServerInfo:
      type: object
      properties:
        serverName:
          type: string
        serverVersion:
          type: string
        vendor:
          type: string
        repositoryUrl:
          type: string
        documentationUrl:
          type: string
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    DataClassification__1:
      type: object
      properties:
        sensitivityLevel:
          type: string
          enum:
          - Public
          - Internal
          - Confidential
          - Restricted
        containsPII:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        dataCategories:
          type: array
          items:
            type: string
        retentionPeriod:
          type: string
        complianceRequirements:
          type: array
          items:
            type: string
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    McpTool:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        toolCategory:
          type: string
          enum:
          - FileOperation
          - WebOperation
          - DataOperation
          - DatabaseOperation
          - SystemOperation
          - SecurityOperation
          - CommunicationOperation
          - CodeOperation
          - SearchOperation
          - Custom
        inputSchema:
          $ref: '#/components/schemas/InputSchema'
        outputSchema:
          $ref: '#/components/schemas/OutputSchema'
        riskLevel:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Critical
        riskFactors:
          type: array
          items:
            type: string
        dataAccess:
          $ref: '#/components/schemas/DataAccess__1'
        requiredPermissions:
          type: array
          items:
            type: string
        sideEffects:
          type: boolean
        idempotent:
          type: boolean
        reversible:
          type: boolean
        timeout:
          type: integer
          format: int32
        rateLimitPerMinute:
          type: integer
          format: int32
        annotations:
          $ref: '#/components/schemas/Annotations'
        usageCount:
          type: integer
          format: int32
        lastUsedAt:
          type: integer
          format: int64
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    AccountabilityMeasures:
      type: object
      properties:
        hasOwner:
          type: boolean
        subjectToHumanOversight:
          type: boolean
        auditTrailEnabled:
          type: boolean
    McpServerCapabilities:
      type: object
      properties:
        toolsSupported:
          type: boolean
        resourcesSupported:
          type: boolean
        promptsSupported:
          type: boolean
        loggingSupported:
          type: boolean
        samplingSupported:
          type: boolean
        rootsSupported:
          type: boolean
    Arguments:
      type: object
    ChangeEvent:
      required:
      - entityId
      - entityType
      - eventType
      - id
      - timestamp
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - entityCreated
          - entityUpdated
          - entityFieldsChanged
          - entityNoChange
          - entitySoftDeleted
          - entityDeleted
          - entityRestored
          - threadCreated
          - threadUpdated
          - postCreated
          - postUpdated
          - taskCreated
          - taskUpdated
          - taskResolved
          - taskClosed
          - logicalTestCaseAdded
          - suggestionCreated
          - suggestionUpdated
          - suggestionAccepted
          - suggestionRejected
          - suggestionDeleted
          - userLogin
          - userLogout
          - entityLineageAdded
          - entityLineageDeleted
          - entityLineageUpdated
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        domains:
          type: array
          items:
            type: string
            format: uuid
        entityFullyQualifiedName:
          type: string
        previousVersion:
          type: number
          format: double
        currentVersion:
          type: number
          format: double
        userName:
          type: string
        impersonatedBy:
          type: string
        timestamp:
          type: integer
          format: int64
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        recursive:
          type: boolean
        entity:
          type: object
    Env:
      type: object
    AIEvidence:
      type: object
      properties:
        dpiaUrl:
          type: string
        fairnessEvidenceUrl:
          type: string
        modelCardUrl:
          type: string
        technicalDocsUrl:
          type: string
        additional:
          type: array
          items:
            $ref: '#/components/schemas/Additional'
    ScopeAndDeployment:
      type: object
      properties:
        scope:
          type: string
          enum:
          - Internal
          - External
          - Both
        deploymentRegions:
          type: array
          items:
            type: string
        affectedUserCount:
          type: integer
          format: int32
    ChangeSummaryMap:
      type: object
    LifeCycle:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/AccessDetails'
        updated:
          $ref: '#/components/schemas/AccessDetails'
        accessed:
          $ref: '#/components/schemas/AccessDetails'
    EUAIActCompliance:
      type: object
      properties:
        riskClassification:
          type: string
          enum:
          - Minimal
          - Limited
          - High
          - Unacceptable
        riskRationale:
          type: string
        prohibitedPractices:
          $ref: '#/components/schemas/ProhibitedPractices'
        highRiskSystems:
          $ref: '#/components/schemas/HighRiskSystems'
        conformityAssessment:
          $ref: '#/components/schemas/ConformityAssessment'
        transparencyObligations:
          $ref: '#/components/schemas/TransparencyObligations'
    ConformityAssessment:
      type: object
      properties:
        assessmentRequired:
          type: boolean
        assessmentType:
          type: string
          enum:
          - Internal
          - ThirdParty
          - NotRequired
        assessmentBody:
          type: string
        certificateNumber:
          type: string
        validUntil:
          type: integer
          format: int64
    McpDataAccessSummary:
      type: object
      properties:
        dataSources:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        accessPatterns:
          type: array
          items:
            type: string
            enum:
            - Read
            - Write
            - Execute
        sensitivityLevel:
