openapi: 3.2.0
info:
  title: OpenMetadata Personas API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Personas
  description: A `Persona` is to represent job function a user does. OpenMetadata uses Persona to define customizable experience in the UI.
paths:
  /v1/personas:
    get:
      tags:
      - Personas
      summary: List personas
      description: Get a list of personas. Use `fields` parameter to get only necessary fields. Use cursor-based pagination to limit the number entries in the list using `limit` and `before` or `after` query params.
      operationId: listPersonas
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: users,contextDefinition
      - name: limit
        in: query
        description: Limit the number of personas returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of personas before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of personas after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of personas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaList'
    put:
      tags:
      - Personas
      summary: Update Persona
      description: Create or Update a Persona.
      operationId: createOrUpdatePersona
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersona'
      responses:
        '200':
          description: The Persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          description: Bad request
    post:
      tags:
      - Personas
      summary: Create a Persona
      description: Create a new Persona.
      operationId: createPersona
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersona'
      responses:
        '200':
          description: The Persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          description: Bad request
  /v1/personas/{id}/aiContext/rules:
    post:
      tags:
      - Personas
      summary: Create a persona AI context rule
      operationId: createPersonaAiContextRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRule'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaContextDefinition'
  /v1/personas/name/{name}:
    get:
      tags:
      - Personas
      summary: Get a Persona by name
      description: Get a Persona by `name`.
      operationId: getPersonaByFQN
      parameters:
      - name: name
        in: path
        description: Name of the Persona
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: users,contextDefinition
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: The Persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: Persona for instance {name} is not found
    delete:
      tags:
      - Personas
      summary: Delete a Persona by name
      description: Delete a Persona by given `name`.
      operationId: deletePersonaByName
      parameters:
      - name: name
        in: path
        description: Name of the Persona
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: Persona for instance {name} is not found
  /v1/personas/{id}:
    get:
      tags:
      - Personas
      summary: Get a persona by id
      description: Get a persona by `id`.
      operationId: getPersonaByID
      parameters:
      - name: id
        in: path
        description: Id of the Persona
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: users,contextDefinition
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The Persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: Persona for instance {id} is not found
    delete:
      tags:
      - Personas
      summary: Delete a Persona by id
      description: Delete a Persona by given `id`.
      operationId: deletePersona
      parameters:
      - name: id
        in: path
        description: Id of the Persona
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Persona for instance {id} is not found
    patch:
      tags:
      - Personas
      summary: Update a Persona
      description: Update an existing persona with JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchPersona_1
      parameters:
      - name: id
        in: path
        description: Id of the Persona
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/personas/{id}/aiContext/rules/{ruleId}:
    put:
      tags:
      - Personas
      summary: Update a persona AI context rule
      operationId: updatePersonaAiContextRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: path
        required: true
        schema:
          pattern: '[0-9a-fA-F\-]{36}'
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRule'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaContextDefinition'
    delete:
      tags:
      - Personas
      summary: Delete a persona AI context rule
      operationId: deletePersonaAiContextRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: path
        required: true
        schema:
          pattern: '[0-9a-fA-F\-]{36}'
          type: string
          format: uuid
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaContextDefinition'
  /v1/personas/async/{id}:
    delete:
      tags:
      - Personas
      summary: Asynchronously delete a Persona by id
      description: Asynchronously delete a Persona by given `id`.
      operationId: deletePersonaAsync
      parameters:
      - name: id
        in: path
        description: Id of the Persona
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Persona for instance {id} is not found
  /v1/personas/{id}/context:
    get:
      tags:
      - Personas
      summary: Get the materialized AI context for a persona by id
      description: Materialize every enabled persona context rule into one cached markdown document, or return the structured result with `?format=json`.
      operationId: getPersonaContextById
      parameters:
      - name: id
        in: path
        description: Persona id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: refresh
        in: query
        description: Bypass the cached materialization; admin and bot only
        schema:
          type: string
          default: 'false'
      responses:
        default:
          description: default response
          content:
            text/markdown; charset=UTF-8: {}
            application/json: {}
  /v1/personas/name/{fqn}/context:
    get:
      tags:
      - Personas
      summary: Get the materialized AI context for a persona by name
      operationId: getPersonaContextByName
      parameters:
      - name: fqn
        in: path
        description: Persona fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: refresh
        in: query
        description: Bypass the cached materialization; admin and bot only
        schema:
          type: string
          default: 'false'
      responses:
        default:
          description: default response
          content:
            text/markdown; charset=UTF-8: {}
            application/json: {}
  /v1/personas/{id}/aiContext:
    get:
      tags:
      - Personas
      summary: Get a persona AI context configuration
      operationId: getPersonaAiContextConfiguration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaContextDefinition'
    put:
      tags:
      - Personas
      summary: Update persona AI context settings
      operationId: updatePersonaAiContextConfiguration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaContextDefinition'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaContextDefinition'
  /v1/personas/{id}/aiContext/document:
    get:
      tags:
      - Personas
      summary: Get the compiled persona AI context document
      operationId: getPersonaAiContextDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/personas/me/context:
    get:
      tags:
      - Personas
      summary: Get the materialized AI context for the caller's active persona
      operationId: getMyPersonaContext
      parameters:
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: refresh
        in: query
        description: Bypass the cached materialization; admin and bot only
        schema:
          type: string
          default: 'false'
      responses:
        default:
          description: default response
          content:
            text/markdown; charset=UTF-8: {}
            application/json: {}
  /v1/personas/{id}/versions/{version}:
    get:
      tags:
      - Personas
      summary: Get a version of the Persona
      description: Get a version of the Persona by given `id`
      operationId: getSpecificPersonaVersion
      parameters:
      - name: id
        in: path
        description: Id of the Persona
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: Personas version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: Persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: Persona for instance {id} and version {version} is not found
  /v1/personas/history:
    get:
      tags:
      - Personas
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp_68
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/personas/{id}/versions:
    get:
      tags:
      - Personas
      summary: List Persona versions
      description: Get a list of all the versions of a persona identified by `id`
      operationId: listAllPersonaVersion
      parameters:
      - name: id
        in: path
        description: Id of the Persona
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of persona versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/personas/name/{fqn}:
    patch:
      tags:
      - Personas
      summary: Update a Persona using name
      description: Update an existing persona with JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchPersona
      parameters:
      - name: fqn
        in: path
        description: Name of the Persona
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/personas/{id}/aiContext/rules/preview:
    post:
      tags:
      - Personas
      summary: Preview the entities matched by a persona AI context rule
      operationId: previewPersonaAiContextRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRule'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreview'
  /v1/personas/{id}/aiContext/document:refresh:
    post:
      tags:
      - Personas
      summary: Force recompilation of a persona AI context document
      operationId: refreshPersonaAiContextDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/personas/search:
    get:
      tags:
      - Personas
      summary: Search personas
      description: Search personas by name or display name. Use `q` parameter to provide the search query.
      operationId: searchPersonas
      parameters:
      - name: q
        in: query
        description: Search query for persona names or display names
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: users,contextDefinition
      - name: limit
        in: query
        description: Limit the number of personas returned. (1 to 1000, default = 10)
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: offset
        in: query
        description: Offset for pagination (default = 0)
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: List of matching personas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaList'
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    CreatePersona:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        displayName:
          type: string
        description:
          type: string
        users:
          type: array
          items:
            type: string
            format: uuid
        contextDefinition:
          $ref: '#/components/schemas/PersonaContextDefinition'
        domains:
          type: array
          items:
            type: string
        default:
          type: boolean
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            type: string
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        extension:
          type: object
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
    ChangeSummaryMap:
      type: object
    LifeCycle:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/AccessDetails'
        updated:
          $ref: '#/components/schemas/AccessDetails'
        accessed:
          $ref: '#/components/schemas/AccessDetails'
    JsonPatch:
      type: object
    PersonaList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    ChangeDescription:
      type: object
      properties:
        fieldsAdded:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsUpdated:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsDeleted:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        previousVersion:
          type: number
          format: double
        changeSummary:
          $ref: '#/components/schemas/ChangeSummaryMap'
    PersonaContextDefinition:
      type: object
      properties:
        enabled:
          type: boolean
        rules:
          maxItems: 25
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/ContextRule'
        characterBudget:
          maximum: 2000000
          minimum: 10000
          type: integer
          format: int32
        cacheTtlMinutes:
          maximum: 1440
          minimum: 1
          type: integer
          format: int32
        lastGeneratedAt:
          type: integer
          format: int64
        cacheState:
          type: string
          enum:
          - FRESH
          - STALE
          - GENERATING
          - FAILED
        lastError:
          type: string
    ResultList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    Persona:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        description:
          type: string
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        impersonatedBy:
          type: string
        href:
          type: string
          format: uri
        uiCustomization:
          $ref: '#/components/schemas/EntityReference'
        contextDefinition:
          $ref: '#/components/schemas/PersonaContextDefinition'
        users:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        version:
          type: number
          format: double
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        domains:
          type: array
          items:
