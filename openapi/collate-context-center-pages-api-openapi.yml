openapi: 3.2.0
info:
  title: OpenMetadata Context Center Pages API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Context Center Pages
  description: APIs related to Context Center pages (articles and quick links).
paths:
  /v1/contextCenter/pages/{id}/followers:
    put:
      tags:
      - Context Center Pages
      summary: Add a follower
      description: Add a user identified by `userId` as follower of this model
      operationId: addFollower_7
      parameters:
      - name: id
        in: path
        description: Id of the Knowledge Page
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
              format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: model for instance {id} is not found
  /v1/contextCenter/pages/{id}/usage:
    put:
      tags:
      - Context Center Pages
      summary: Add Knowledge Page usage
      operationId: addKnowledgePageUsage
      parameters:
      - name: id
        in: path
        description: Id of the Knowledge Page
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EntityReference'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
    delete:
      tags:
      - Context Center Pages
      summary: remove Knowledge Page usage
      description: remove Knowledge Page Usage
      operationId: removeKnowledgePageUsage
      parameters:
      - name: id
        in: path
        description: Id of the knowledge page
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EntityReference'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
  /v1/contextCenter/pages:
    get:
      tags:
      - Context Center Pages
      summary: Get a list of Knowledge Pages
      description: Get a list of Knowledge Pages. Use `fields` parameter to get only necessary fields. Use cursor-based pagination to limit the number entries in the list using `limit` and `before` or `after` query params.
      operationId: listKnowledgePages
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,tags,followers,votes,page,parent,childrenCount,relatedEntities,relatedArticles,attachments,domains,dataProducts
      - name: entityType
        in: query
        description: Type of the entity for which to list the Knowledge Pages
        schema:
          type: string
      - name: pageType
        in: query
        description: Knowledge Page Type
        schema:
          type: string
      - name: entityId
        in: query
        description: UUID of the entity for which to list the Knowledge Pages
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Limit the number Knowledge Pages returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: tagFQN
        in: query
        description: UUID of the entity for which to list the Knowledge Pages
        schema:
          type: string
      - name: before
        in: query
        description: Returns list of Knowledge Pages before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of Knowledge Pages after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: sortBy
        in: query
        description: 'Field to sort by. Supported: name, createdAt, updatedAt.'
        schema:
          type: string
          enum:
          - name
          - createdAt
          - updatedAt
      - name: sortOrder
        in: query
        description: 'Sort order. Supported: asc, desc. Defaults to desc when sortBy is set.'
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: offset
        in: query
        description: Offset for offset-based pagination when sortBy is used.
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: Get List of Knowledge Pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
    put:
      tags:
      - Context Center Pages
      summary: Create or update a Knowledge Page
      description: Create a Knowledge Page, if it does not exist. If a knowledge page already exists, update the Knowledge Page.
      operationId: createOrUpdateKnowledgePage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePage'
      responses:
        '200':
          description: The Knowledge Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          description: Bad request
    post:
      tags:
      - Context Center Pages
      summary: Create a Knowledge Page
      description: Create a Knowledge Page.
      operationId: createKnowledgePage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePage'
      responses:
        '200':
          description: The Knowledge Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          description: Bad request
  /v1/contextCenter/pages/name/{fqn}:
    get:
      tags:
      - Context Center Pages
      summary: Get a KnowledgePage by name
      description: Get a KnowledgePage by fully qualified table name.
      operationId: getKnowledgePageFqn
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the KnowledgePage
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,tags,followers,votes,page,parent,childrenCount,relatedEntities,relatedArticles,attachments,domains,dataProducts
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: KnowledgePage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          description: KnowledgePage for instance {id} is not found
    delete:
      tags:
      - Context Center Pages
      summary: Delete a Knowledge Page
      description: Delete a KnowledgePage by `fullyQualifiedName`.
      operationId: deleteKnowledgePageByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the Knowledge Page
        required: true
        schema:
          type: string
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
        '404':
          description: Knowledge Page for instance {fqn} is not found
  /v1/contextCenter/pages/{id}:
    get:
      tags:
      - Context Center Pages
      summary: Get a Knowledge Page
      description: Get a KnowledgePage by `id`
      operationId: getKnowledgePageById
      parameters:
      - name: id
        in: path
        description: KnowledgePage Id
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,tags,followers,votes,page,parent,childrenCount,relatedEntities,relatedArticles,attachments,domains,dataProducts
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: KnowledgePage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          description: KnowledgePage for instance {id} is not found
    delete:
      tags:
      - Context Center Pages
      summary: Delete a Knowledge Page
      description: Delete a knowledge page by `id`.
      operationId: deleteKnowledgePage
      parameters:
      - name: id
        in: path
        description: Id of the Knowledge Page
        required: true
        schema:
          type: string
          format: uuid
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
        '404':
          description: Knowledge Page for instance {id} is not found
    patch:
      tags:
      - Context Center Pages
      summary: Update a Knowledge Page
      description: Update an existing Knowledge Page using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchKnowledgePage
      parameters:
      - name: id
        in: path
        description: Id of the Knowledge Page
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/contextCenter/pages/async/{id}:
    delete:
      tags:
      - Context Center Pages
      summary: Asynchronously delete a Knowledge Page
      description: Asynchronously delete a knowledge page by `id`.
      operationId: deleteKnowledgePageAsync
      parameters:
      - name: id
        in: path
        description: Id of the Knowledge Page
        required: true
        schema:
          type: string
          format: uuid
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
        '404':
          description: Knowledge Page for instance {id} is not found
  /v1/contextCenter/pages/{id}/followers/{userId}:
    delete:
      tags:
      - Context Center Pages
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the model.
      operationId: deleteFollower_10
      parameters:
      - name: id
        in: path
        description: Id of the Knowledge Page
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/contextCenter/pages/{id}/context:
    get:
      tags:
      - Context Center Pages
      summary: Get the AI context for an entity by id
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity — its attached business knowledge (glossary terms, Context Center articles, applied metrics), type-specific structural context, and depth-1 lineage — as an OKF-style markdown document (default) or the structured AIContext JSON (`?format=json`).
      operationId: getEntityAiContextById_42
      parameters:
      - name: id
        in: path
        description: Entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/contextCenter/pages/name/{fqn}/context:
    get:
      tags:
      - Context Center Pages
      summary: Get the AI context for an entity by fully qualified name
      description: Retrieve the LLM-ready AI Context (Context Profile) for the entity by FQN — see getEntityAiContextById. Returns an OKF-style markdown document by default, or the structured AIContext JSON with `?format=json`.
      operationId: getEntityAiContextByName_42
      parameters:
      - name: fqn
        in: path
        description: Entity fully qualified name
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: 'Output format: markdown (default) or json'
        schema:
          type: string
          default: markdown
      - name: query
        in: query
        description: Optional question; truncated knowledge items are excerpted to the passage most relevant to it instead of the positional lead
        schema:
          type: string
      responses:
        '200':
          description: Entity AI context
        '404':
          description: Entity not found
  /v1/contextCenter/pages/{id}/versions/{version}:
    get:
      tags:
      - Context Center Pages
      summary: Get a specific version of the KnowledgePage
      description: Get a version of the KnowledgePage by given `id`
      operationId: getSpecificKnowledgePageVersion
      parameters:
      - name: id
        in: path
        description: KnowledgePage Id
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: KnowledgePage version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: KnowledgePage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          description: KnowledgePage for instance {id} and version {version} is not found
  /v1/contextCenter/pages/history:
    get:
      tags:
      - Context Center Pages
      summary: List all entity versions within a time range
      description: Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch.
      operationId: listAllEntityVersionsByTimestamp_41
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/contextCenter/pages/hierarchy:
    get:
      tags:
      - Context Center Pages
      summary: List Page with hierarchy
      description: Get a list of pages with hierarchy.
      operationId: listPageHierarchy
      parameters:
      - name: pageType
        in: query
        description: Knowledge Page Type
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the number of pages returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10000
      responses:
        '200':
          description: List of pages with hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
  /v1/contextCenter/pages/search/hierarchy:
    get:
      tags:
      - Context Center Pages
      summary: List Page with hierarchy from Search
      description: Get a list of pages with hierarchy from Search.
      operationId: listPageHierarchySearch
      parameters:
      - name: pageType
        in: query
        description: Knowledge Page Type
        schema:
          type: string
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Limit the number of pages returned. (1 to 1000000, default = 10)
        schema:
          type: integer
          format: int32
          default: 10
      - name: parent
        in: query
        description: Parent Fully Qualified Name
        schema:
          type: string
      - name: activeFqn
        in: query
        description: FQN of the active page to show the active page correctly in  the hierarchy , while showing other root nodes at level 1.
        schema:
          type: string
      - name: sortBy
        in: query
        description: 'Field to sort by. Supported: name, updatedAt.'
        schema:
          type: string
          enum:
          - name
          - updatedAt
      - name: sortOrder
        in: query
        description: 'Sort order. Supported: asc, desc. Defaults to desc.'
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: List of pages with hierarchy from Search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
  /v1/contextCenter/pages/{id}/versions:
    get:
      tags:
      - Context Center Pages
      summary: Get List of all KnowledgePage versions
      description: Get a list of all the versions of a KnowledgePage identified by `id`
      operationId: listAllKnowledgePageVersion
      parameters:
      - name: id
        in: path
        description: KnowledgePage Id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of KnowledgePage versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/contextCenter/pages/restore:
    put:
      tags:
      - Context Center Pages
      summary: Restore a soft deleted Knowledge Page
      description: Restore a soft deleted Knowledge Page.
      operationId: restore_24
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: 'Successfully restored the Knowledge Page '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
  /v1/contextCenter/pages/{id}/vote:
    put:
      tags:
      - Context Center Pages
      summary: Update Vote for a this entity
      description: Update vote for a entity
      operationId: updateVote
      parameters:
      - name: id
        in: path
        description: Id of the Query
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: model for instance {id} is not found
components:
  schemas:
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    EntityReference:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        fullyQualifiedName:
          type: string
        description:
          type: string
        displayName:
          type: string
        deleted:
          type: boolean
        inherited:
          type: boolean
        href:
          type: string
          format: uri
    CreatePage:
      required:
      - name
      - page
      - pageType
      type: object
      properties:
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::)[^>"\x00-\x1f])*$
          type: string
        displayName:
          type: string
        description:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        entityStatus:
          type: string
          enum:
          - Draft
          - In Review
          - Approved
          - Archived
          - Deprecated
          - Rejected
          - Unprocessed
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        pageType:
          type: string
          enum:
          - Article
          - QuickLink
        page:
          type: object
        relatedEntities:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        parent:
          $ref: '#/components/schemas/EntityReference'
        domains:
          type: array
          items:
            type: string
        dataProducts:
          type: array
          items:
            type: string
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        extension:
          type: object
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    ChangeEvent:
      required:
      - entityId
      - entityType
      - eventType
      - id
      - timestamp
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - entityCreated
          - entityUpdated
          - entityFieldsChanged
          - entityNoChange
          - entitySoftDeleted
          - entityDeleted
          - entityRestored
          - threadCreated
          - threadUpdated
          - postCreated
          - postUpdated
          - taskCreated
          - taskUpdated
          - taskResolved
          - taskClosed
          - logicalTestCaseAdded
          - suggestionCreated
          - suggestionUpdated
          - suggestionAccepted
          - suggestionRejected
          - suggestionDeleted
          - userLogin
          - userLogout
          - entityLineageAdded
          - entityLineageDeleted
          - entityLineageUpdated
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        domains:
          type: array
          items:
            type: string
            format: uuid
        entityFullyQualifiedName:
          type: string
        previousVersion:
          type: number
          format: double
        currentVersion:
