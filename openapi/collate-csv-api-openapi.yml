openapi: 3.2.0
info:
  title: OpenMetadata CSV API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2.0.5
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: CSV
  description: CSV import and export metadata APIs.
paths:
  /v1/csv/documentation/{entityType}:
    get:
      tags:
      - CSV
      summary: Get CSV column documentation
      operationId: getCsvDocumentation
      parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
      - name: recursive
        in: query
        schema:
          type: boolean
          default: false
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvDocumentation'
components:
  schemas:
    CsvHeader:
      required:
      - description
      - examples
      - name
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        description:
          type: string
        examples:
          type: array
          items:
            type: string
    CsvDocumentation:
      required:
      - headers
      - summary
      type: object
      properties:
        summary:
          type: string
        headers:
          type: array
          items:
            $ref: '#/components/schemas/CsvHeader'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
