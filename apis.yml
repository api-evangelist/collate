apis:
- aid: collate-openmetadata-rest-api
  name: OpenMetadata REST API
  description: >-
    The OpenMetadata REST API — a JWT-authenticated (Bearer) CRUD API over every
    data asset and governance entity in OpenMetadata (databases, schemas, tables,
    dashboards, charts, pipelines, topics, containers, ML models, API
    collections/endpoints, glossaries, teams, users, policies, bots), plus
    lineage, versions, and change events. The spec ships as an OpenAPI 3.0.3
    document declaring HTTP Bearer (JWT) security; the full per-entity operation
    surface is documented in the API reference.
