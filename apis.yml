aid: collate
name: Collate
description: Collate is the commercial company behind OpenMetadata, the open-source unified metadata platform
  and data catalog for data and AI. OpenMetadata provides a single place to discover, govern, observe,
  and collaborate on data assets — databases, tables, dashboards, pipelines, ML models, topics, containers,
  and API collections/endpoints — with a JSON-schema-first metadata standard, 90+ ingestion connectors,
  data quality and profiling, lineage, glossary, and role-based access control. Everything in the product
  is driven by a comprehensive JWT-authenticated REST API (plus Python and Java SDKs, a `metadata` CLI,
  webhook change-events, and a hosted MCP server), making the metadata layer fully programmable for humans,
  AI assistants, and agents. Collate offers a managed, enterprise SaaS edition of OpenMetadata. Backed
  by CRV and Redpoint Ventures.
