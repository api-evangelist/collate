  (issuer https://sandbox.open-metadata.org/mcp, authorization_code + refresh_token grants, PKCE S256,
  dynamic client registration). The endpoint is live: GET /mcp returns 405 (method not allowed) and an
  unauthenticated JSON-RPC tools/list POST returns 401 (McpError, token required) — confirming a real
  MCP transport that requires OAuth. The MCP server is bundled in the OpenMetadata server (self-hostable);
  the URL below is the public sandbox instance. Tool list is not enumerated here because it requires authentication
  (401) and is not published statically; it exposes OpenMetadata''s search/read/govern operations over
  data assets.'
